# Local stack: S3-compatible object store + API + watcher.
#
# Object store: RustFS, a MinIO-compatible server. MinIO stopped publishing
# community images (minio/minio and quay.io/minio/minio no longer pull), so the
# stack uses RustFS locally. The app only knows S3_ENDPOINT_URL, so any
# S3-compatible store (or real AWS S3 with STORAGE_MODE=cloud) works unchanged.
#   cp .env.example .env   (set AWS_SECRET_ACCESS_KEY; optionally ANTHROPIC_API_KEY)
#   docker compose up -d --build
#
# The watched tree, metadata DB and restore output live in named volumes
# shared by api + watcher. Named volumes (not host bind mounts) because:
#   * inotify events propagate between containers on the same volume, but not
#     reliably from a Windows/macOS host folder into a Linux container;
#   * the non-root container user can always write to them.
# Inspect files with:  docker compose exec api ls -R sandbox/watched

x-app-env: &app-env
  STORAGE_MODE: local
  S3_ENDPOINT_URL: http://s3:9000
  DATABASE_URL: sqlite:////app/data/metadata.db
  WATCH_DIR: /app/sandbox/watched
  RESTORE_DIR: /app/restore_out
  MODEL_PATH: /app/ml/artifacts/model.joblib
  LOG_FORMAT: json

services:
  s3:
    image: rustfs/rustfs:latest
    ports:
      - "${S3_PORT:-9000}:9000" # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001" # web console
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3-data:/data
    healthcheck:
      # Any HTTP answer (even 403 for an unsigned request) means the server is up.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    image: ransomware-recovery-agent:latest
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000" # host port overridable: API_PORT=8080 docker compose up
    volumes:
      - app-data:/app/data
      - sandbox:/app/sandbox
      - restore-out:/app/restore_out
    depends_on:
      s3:
        condition: service_healthy
    restart: unless-stopped

  watcher:
    image: ransomware-recovery-agent:latest
    command: ["python", "-m", "app.detection.monitor"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - app-data:/app/data
      - sandbox:/app/sandbox
    depends_on:
      api: # api creates the DB schema and watch dir on startup
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.detection.monitor", "--check"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  s3-data:
  app-data:
  sandbox:
  restore-out:
