name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch keeps the install small)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check app tests ml simulator scripts
          ruff format --check app tests ml simulator scripts
      - name: Tests (S3 mocked, Claude mocked, offline embedder)
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q
      - name: Training is reproducible
        run: |
          python -m ml.generate_dataset --benign 2000 --attack 600 --out /tmp/a.csv
          python -m ml.generate_dataset --benign 2000 --attack 600 --out /tmp/b.csv
          cmp /tmp/a.csv /tmp/b.csv

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (trains the model inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ransomware-recovery-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
